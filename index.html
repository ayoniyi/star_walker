<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceWalker</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <canvas></canvas>

    <div class="btnContainer" id="soundBtn" title="Toggle Sound (M)">
      <img
        id="soundIcon"
        src="./soundon.png"
        alt="Sound On"
        width="26"
        height="26"
      />
    </div>

    <audio id="music" src="./soundtrack-short.mp3" preload="auto" loop></audio>

    <!-- Modal dialog for welcome screen, pause menu, and game messages -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal" id="modalDialog">
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-buttons" id="modalButtons"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
